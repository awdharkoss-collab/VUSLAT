<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>VUSLAT AI • Ultimate</title>
    <style>
        :root { --bg: #070b14; --panel: #0f172a; --accent: #38bdf8; --purple: #8b5cf6; --text: #f1f5f9; }
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', Roboto, sans-serif; }
        html, body { width: 100%; height: 100dvh; background: var(--bg); color: var(--text); display: flex; flex-direction: column; overflow: hidden; }
        header { background: var(--panel); padding: 10px 14px; display: flex; align-items: center; justify-content: space-between; border-bottom: 1px solid rgba(56,189,248,0.25); }
        .brand { font-size: 16px; font-weight: 900; color: var(--accent); letter-spacing: 0.5px; }
        .top-btns { display: flex; gap: 6px; }
        .chip { background: #1e293b; color: #e2e8f0; border: 1px solid rgba(56,189,248,0.3); padding: 5px 9px; border-radius: 8px; font-size: 11px; font-weight: 700; cursor: pointer; }
        .modes { display: flex; gap: 6px; overflow-x: auto; padding: 8px 12px; background: #0b1120; border-bottom: 1px solid rgba(255,255,255,0.06); scrollbar-width: none; }
        .modes::-webkit-scrollbar { display: none; }
        .mode-btn { background: #1e293b; color: #cbd5e1; border: 1px solid transparent; padding: 6px 10px; border-radius: 10px; font-size: 11px; font-weight: 700; white-space: nowrap; cursor: pointer; flex-shrink: 0; }
        .mode-btn.active { background: rgba(56,189,248,0.16); color: var(--accent); border-color: var(--accent); }
        .chat { flex: 1; overflow-y: auto; padding: 14px; display: flex; flex-direction: column; gap: 12px; }
        .msg { max-width: 86%; padding: 11px 14px; border-radius: 14px; font-size: 14px; line-height: 1.55; word-wrap: break-word; }
        .msg.user { align-self: flex-end; background: linear-gradient(135deg, #2563eb, #7c3aed); color: #fff; border-bottom-right-radius: 4px; }
        .msg.bot { align-self: flex-start; background: var(--panel); border: 1px solid rgba(56,189,248,0.25); border-bottom-left-radius: 4px; }
        .msg img { max-width: 100%; border-radius: 10px; margin-top: 6px; display: block; }
        .bar { background: var(--panel); padding: 10px; display: flex; align-items: center; gap: 6px; border-top: 1px solid rgba(56,189,248,0.25); }
        .icon-btn { background: #1e293b; color: #fff; border: none; width: 38px; height: 38px; border-radius: 10px; font-size: 16px; cursor: pointer; flex-shrink: 0; }
        input[type="text"] { flex: 1; min-width: 0; background: #070b14; color: #fff; border: 1px solid #334155; padding: 10px 12px; border-radius: 12px; font-size: 14px; outline: none; }
        .send-btn { background: linear-gradient(135deg, #38bdf8, #8b5cf6); color: #070b14; border: none; padding: 0 14px; height: 38px; border-radius: 12px; font-weight: 900; font-size: 13px; cursor: pointer; flex-shrink: 0; }
    </style>
</head>
<body>
<header>
    <div class="brand">⚡ VUSLAT AI • Ultimate</div>
    <div class="top-btns">
        <button type="button" class="chip" onclick="toggleVoice()">🔊 Ses</button>
        <button type="button" class="chip" onclick="clearChat()">🗑️ Temizle</button>
    </div>
</header>

<div class="modes">
    <button type="button" class="mode-btn active" onclick="setMode(this, 'Sen Vuslat adlı Türkçe konuşan zeki ve pratik bir kişisel asistansın.')">🤖 Genel Asistan</button>
    <button type="button" class="mode-btn" onclick="setMode(this, 'Sen derin veri analisti ve araştırmacısın. Detaylı ve maddeli yanıt ver.')">📊 Derin Analiz</button>
    <button type="button" class="mode-btn" onclick="setMode(this, 'Sen usta bir rüya tabircisisin. Sembolleri Türkçe yorumla.')">🔮 Rüya Tabiri</button>
    <button type="button" class="mode-btn" onclick="setMode(this, 'Sen viral Reels ve TikTok senaristisin. Etkileyici kısa senaryo yaz.')">🎬 Reels Senaryosu</button>
    <button type="button" class="mode-btn" onclick="setMode(this, 'Sen zihin haritası ve strateji uzmanısın. Konuyu dallara ayır.')">🧠 Zihin Haritası</button>
    <button type="button" class="mode-btn" onclick="setMode(this, 'Sen ilişki ve mesaj analistisin. Gönderilen mesajların alt metnini analiz et.')">💬 Mesaj Analizi</button>
</div>

<div class="chat" id="chatBox">
    <div class="msg bot">Merhaba! Sorunu yazabilir, fotoğraf yükleyebilir (otomatik hızlandırılmış) veya 🎨 Çiz butonuyla görsel oluşturabilirsin.</div>
</div>

<div class="bar">
    <input type="file" id="imgInput" accept="image/*" style="display:none;" onchange="handleImageUpload(event)">
    <button type="button" class="icon-btn" onclick="document.getElementById('imgInput').click()">📷</button>
    <input type="text" id="msgInput" placeholder="Sor, çizdir veya fotoğraf at..." onkeydown="if(event.key==='Enter') sendMessage()">
    <button type="button" class="icon-btn" style="background:#0ea5e9; color:#070b14; font-weight:900; font-size:12px;" onclick="generateImage()">🎨 Çiz</button>
    <button type="button" class="send-btn" onclick="sendMessage()">Gönder</button>
</div>
<script>
    let systemPrompt = "Sen Vuslat adlı Türkçe konuşan zeki ve pratik bir kişisel asistansın.";
    let chatHistory = [];
    let voiceEnabled = false;

    function addMsg(html, sender) {
        const box = document.getElementById("chatBox");
        const div = document.createElement("div");
        div.className = "msg " + sender;
        div.innerHTML = html;
        box.appendChild(div);
        box.scrollTop = box.scrollHeight;
        return div;
    }

    function setMode(btn, prompt) {
        document.querySelectorAll(".mode-btn").forEach(b => b.classList.remove("active"));
        btn.classList.add("active");
        systemPrompt = prompt;
    }

    function toggleVoice() {
        voiceEnabled = !voiceEnabled;
        alert(voiceEnabled ? "🔊 Sesli okuma açıldı." : "🔇 Sesli okuma kapatıldı.");
    }

    function clearChat() {
        chatHistory = [];
        document.getElementById("chatBox").innerHTML = `<div class="msg bot">Sohbet temizlendi. Hazırım!</div>`;
    }

    async function compressImageFast(file) {
        return new Promise((resolve, reject) => {
            const img = new Image();
            const url = URL.createObjectURL(file);
            img.onload = () => {
                URL.revokeObjectURL(url);
                const maxDim = 640;
                let w = img.width, h = img.height;
                if (w > maxDim || h > maxDim) {
                    if (w > h) { h = Math.round((h * maxDim) / w); w = maxDim; }
                    else { w = Math.round((w * maxDim) / h); h = maxDim; }
                }
                const canvas = document.createElement("canvas");
                canvas.width = w;
                canvas.height = h;
                canvas.getContext("2d").drawImage(img, 0, 0, w, h);
                resolve(canvas.toDataURL("image/jpeg", 0.65));
            };
            img.onerror = () => { URL.revokeObjectURL(url); reject(new Error("Görsel okunamadı")); };
            img.src = url;
        });
    }

    async function handleImageUpload(e) {
        const file = e.target.files.at(0);
        if (!file) return;
        const promptInput = document.getElementById("msgInput");
        const userQ = promptInput.value.trim() || "Bu görseli Türkçe olarak kısa, net ve detaylı açıkla.";
        promptInput.value = "";
        e.target.value = "";

        const compressedUrl = await compressImageFast(file);
        addMsg(`${userQ}<img src="${compressedUrl}">`, "user");
        const waitBubble = addMsg("⚡ Vuslat görseli hızlı işliyor...", "bot");

        const apiHost = atob("aHR0cHM6Ly90ZXh0LnBvbGxpbmF0aW9uLmFpL29wZW5haQ==");
        const models = new Array("openai", "openai-large");
        let answered = false;

        for (const m of models) {
            try {
                const res = await fetch(apiHost, {
                    method: "POST",
                    headers: { "Content-Type": "application/json" },
                    body: JSON.stringify({
                        model: m,
                        max_tokens: 650,
                        messages: [{
                            role: "user",
                            content: [
                                { type: "text", text: userQ },
                                { type: "image_url", image_url: { url: compressedUrl } }
                            ]
                        }]
                    }),
                    signal: AbortSignal.timeout(12000)
                });
                if (!res.ok) continue;
                const data = await res.json();
                const text = data?.choices?.at(0)?.message?.content;
                if (text && text.trim()) {
                    waitBubble.innerText = text.trim();
                    answered = true;
                    break;
                }
            } catch (err) {}
        }
        if (!answered) waitBubble.innerText = "Görsel sunucusu şu an meşgul, birkaç saniye sonra tekrar dene.";
    }
    async function sendMessage() {
        const input = document.getElementById("msgInput");
        const text = input.value.trim();
        if (!text) return;
        input.value = "";
        addMsg(text, "user");
        chatHistory.push({ role: "user", content: text });
        if (chatHistory.length > 8) chatHistory = chatHistory.slice(-8);

        const waitBubble = addMsg("⏳ Yazıyor...", "bot");
        const apiHost = atob("aHR0cHM6Ly90ZXh0LnBvbGxpbmF0aW9uLmFpL29wZW5haQ==");

        try {
            const res = await fetch(apiHost, {
                method: "POST",
                headers: { "Content-Type": "application/json" },
                body: JSON.stringify({
                    model: "openai",
                    messages: [{ role: "system", content: systemPrompt }, ...chatHistory]
                }),
                signal: AbortSignal.timeout(12000)
            });
            const data = await res.json();
            const reply = data?.choices?.at(0)?.message?.content || "Yanıt alınamadı.";
            waitBubble.innerText = reply;
            chatHistory.push({ role: "assistant", content: reply });
            if (voiceEnabled && "speechSynthesis" in window) {
                const u = new SpeechSynthesisUtterance(reply);
                u.lang = "tr-TR";
                speechSynthesis.speak(u);
            }
        } catch (e) {
            waitBubble.innerText = "Bağlantı zaman aşımına uğradı, tekrar dene.";
        }
    }

    function generateImage() {
        const input = document.getElementById("msgInput");
        const prompt = input.value.trim();
        if (!prompt) { alert("Çizdirmek istediğin şeyi yaz!"); return; }
        input.value = "";
        addMsg("🎨 Çiziliyor: " + prompt, "user");
        const imgHost = atob("aHR0cHM6Ly9pbWFnZS5wb2xsaW5hdGlvbnMuYWkvcHJvbXB0Lw==");
        const url = `${imgHost}${encodeURIComponent(prompt)}?width=768&height=768&nologo=true&seed=${Date.now()}`;
        addMsg(`<img src="${url}" alt="Vuslat AI">`, "bot");
    }
</script>
</body>
</html>
