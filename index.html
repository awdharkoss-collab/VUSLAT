<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>VUSLAT AI</title>
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="VUSLAT">
    <link rel="apple-touch-icon" href="logo.png">
    <style>
        :root { --bg: #090a0f; --panel: #13151f; --accent: #7c3aed; --text: #f3f4f6; }
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', Roboto, sans-serif; }
        html, body { width: 100%; height: 100dvh; background: var(--bg); color: var(--text); display: flex; flex-direction: column; overflow: hidden; }
        header { background: var(--panel); padding: 10px; display: flex; align-items: center; gap: 6px; border-bottom: 1px solid rgba(255,255,255,0.08); }
        .logo { font-size: 17px; font-weight: 900; background: linear-gradient(90deg, #a78bfa, #22d3ee); -webkit-background-clip: text; -webkit-text-fill-color: transparent; flex-shrink: 0; }
        .mode-sel { background: #1e2130; color: #fff; border: 1px solid rgba(124,58,237,0.5); padding: 5px; border-radius: 8px; font-size: 11px; font-weight: 700; outline: none; flex: 1; min-width: 0; }
        .header-btns { display: flex; gap: 4px; flex-shrink: 0; }
        .icon-btn { background: #1f2230; color: #fff; border: 1px solid rgba(255,255,255,0.12); padding: 6px 8px; border-radius: 8px; font-size: 11px; font-weight: 700; cursor: pointer; white-space: nowrap; }
        .icon-btn.live { background: #059669; border: none; }
        .chips { display: flex; gap: 6px; overflow-x: auto; padding: 8px 12px; background: #0d0f16; border-bottom: 1px solid rgba(255,255,255,0.05); scrollbar-width: none; }
        .chips::-webkit-scrollbar { display: none; }
        .chip { background: #181b28; color: #d1d5db; border: 1px solid rgba(255,255,255,0.1); padding: 5px 10px; border-radius: 16px; font-size: 11px; white-space: nowrap; cursor: pointer; flex-shrink: 0; }
        .chat-box { flex: 1; overflow-y: auto; padding: 12px; display: flex; flex-direction: column; gap: 12px; }
        .msg { max-width: 88%; padding: 10px 14px; border-radius: 14px; font-size: 14px; line-height: 1.5; word-wrap: break-word; white-space: pre-wrap; }
        .msg.user { align-self: flex-end; background: linear-gradient(135deg, #7c3aed, #5b21b6); color: #fff; border-bottom-right-radius: 4px; }
        .msg.ai { align-self: flex-start; background: var(--panel); border: 1px solid rgba(255,255,255,0.08); color: #e5e7eb; border-bottom-left-radius: 4px; }
        .msg img { max-width: 100%; border-radius: 10px; margin-top: 8px; display: block; }
        .msg-actions { display: flex; gap: 12px; margin-top: 8px; padding-top: 6px; border-top: 1px solid rgba(255,255,255,0.06); }
        .act-tag { font-size: 11px; color: #38bdf8; cursor: pointer; font-weight: 700; text-decoration: none; }
        .preview-bar { display: none; background: #181b28; padding: 8px 12px; align-items: center; gap: 10px; border-top: 1px solid rgba(255,255,255,0.1); }
        .preview-bar img { height: 42px; width: 42px; object-fit: cover; border-radius: 6px; }
        .input-bar { background: var(--panel); padding: 10px; display: flex; gap: 6px; align-items: center; border-top: 1px solid rgba(255,255,255,0.08); }
        .text-in { flex: 1; background: #1d202e; border: 1px solid rgba(255,255,255,0.15); color: #fff; padding: 10px 12px; border-radius: 22px; font-size: 14px; outline: none; min-width: 60px; }
        .round-btn { background: #1f2230; color: #fff; border: 1px solid rgba(255,255,255,0.15); width: 38px; height: 38px; border-radius: 50%; font-size: 16px; cursor: pointer; flex-shrink: 0; }
        .round-btn.listening { background: #ef4444; border-color: #ef4444; }
        .art-btn { background: #0284c7; color: #fff; border: none; padding: 0 11px; height: 38px; border-radius: 20px; font-weight: 800; font-size: 12px; cursor: pointer; flex-shrink: 0; }
        .send-btn { background: var(--accent); color: #fff; border: none; padding: 0 13px; height: 38px; border-radius: 20px; font-weight: 700; font-size: 13px; cursor: pointer; flex-shrink: 0; }
        .modal { display: none; position: fixed; inset: 0; background: rgba(0,0,0,0.9); z-index: 999; align-items: center; justify-content: center; padding: 16px; }
        .modal-card { background: var(--panel); border: 1px solid var(--accent); border-radius: 14px; padding: 18px; width: 100%; max-width: 420px; max-height: 85vh; overflow-y: auto; }
        .modal-card input, .modal-card select { width: 100%; background: #0d0f16; color: #fff; border: 1px solid #333; padding: 10px; border-radius: 8px; margin-bottom: 12px; font-size: 13px; outline: none; }
        .hist-item { background: #1b1e2b; padding: 10px; border-radius: 8px; margin-bottom: 8px; display: flex; justify-content: space-between; align-items: center; cursor: pointer; font-size: 13px; }
        .call-screen { display: none; position: fixed; inset: 0; background: radial-gradient(circle at center, #1e1b4b 0%, #090a0f 75%); z-index: 1000; flex-direction: column; align-items: center; justify-content: space-between; padding: 40px 20px; text-align: center; }
        .orb { width: 140px; height: 140px; border-radius: 50%; background: radial-gradient(circle, #38bdf8, #7c3aed); box-shadow: 0 0 45px rgba(124,58,237,0.7); display: flex; align-items: center; justify-content: center; font-size: 44px; transition: 0.3s; }
        .orb.pulse { transform: scale(1.15); box-shadow: 0 0 70px rgba(6,182,212,0.95); }
        .hangup-btn { background: #ef4444; color: #fff; border: none; padding: 14px 32px; border-radius: 30px; font-size: 16px; font-weight: 800; cursor: pointer; }
    </style>
</head>
<body>
<header>
    <button type="button" class="icon-btn" onclick="openHistory()">☰</button>
    <div class="logo">VUSLAT</div>
    <select id="personaSelect" class="mode-sel">
        <option value="general">🤖 Genel</option>
        <option value="english">🇬🇧 İngilizce</option>
        <option value="coder">💻 Yazılım</option>
        <option value="friend">😎 Arkadaş</option>
    </select>
    <div class="header-btns">
        <button type="button" class="icon-btn live" onclick="startLiveCall()">📞 Canlı Konuş</button>
        <button type="button" class="icon-btn" onclick="openSettings()">⚙️ Ayar</button>
    </div>
</header>

<div class="chips">
    <div class="chip" onclick="quickAsk('Benimle İngilizce sohbet et ve hatalarımı düzelt.')">🇬🇧 İngilizce Pratik</div>
    <div class="chip" onclick="quickAsk('Bana bugün için verimli bir plan hazırla.')">📅 Günlük Plan</div>
</div>

<div class="chat-box" id="chatBox"></div>

<div class="preview-bar" id="previewBar">
    <img id="previewImg" src="">
    <span style="font-size:12px; color:#9ca3af; flex:1;">Fotoğraf seçildi (Ne değiştirmek istediğini yazıp Gönder'e bas)</span>
    <button type="button" class="icon-btn" onclick="clearAttachedImage()">✕</button>
</div>

<div class="input-bar">
    <input type="file" id="imgInput" accept="image/*" style="display:none" onchange="handleImageUpload(event)">
    <button type="button" class="round-btn" onclick="document.getElementById('imgInput').click()">📷</button>
    <button type="button" id="micBtn" class="round-btn" onclick="toggleVoice()">🎤</button>
    <input type="text" id="userInput" class="text-in" placeholder="Yaz, çizdir veya fotoğraf düzenlet..." onkeyup="if(event.key==='Enter') sendMessage()">
    <button type="button" class="art-btn" onclick="triggerImageGen()">🎨 Çiz</button>
    <button type="button" class="send-btn" onclick="sendMessage()">Gönder</button>
</div>

<div class="call-screen" id="liveCallScreen">
    <div>
        <div style="font-size:12px; color:#38bdf8; font-weight:800;">VUSLAT CANLI SESLİ SOHBET</div>
        <h2 id="callVoiceLabel" style="font-size:20px; margin-top:6px;">Karşılıklı Konuşma</h2>
    </div>
    <div>
        <div class="orb" id="callOrb">🎙️</div>
        <p id="callStatusText" style="margin-top:20px; font-size:15px; color:#e5e7eb; max-width:300px;">Seni dinliyorum...</p>
    </div>
    <button type="button" class="hangup-btn" onclick="endLiveCall()">📵 Konuşmayı Bitir</button>
</div>

<div class="modal" id="settingsModal">
    <div class="modal-card">
        <h3 style="margin-bottom:10px;">⚙️ Vuslat Ses & API Ayarı</h3>
        <p style="font-size:12px; color:#9ca3af; margin-bottom:4px;">Gemini API Anahtarı:</p>
        <input type="password" id="apiKeyInput" placeholder="AIza...">
        <p style="font-size:12px; color:#9ca3af; margin-bottom:4px;">🎭 Ses Karakteri (Kadın / Erkek):</p>
        <select id="voiceGenderProfile">
            <option value="deep_male">👨 Kalın Erkek Sesi (Tok & Doğal)</option>
            <option value="normal_male">🧔 Normal Erkek Sesi</option>
            <option value="natural_female">👩 Doğal Kadın Sesi</option>
            <option value="soft_female">👱‍♀️ Enerjik Kadın Sesi</option>
        </select>
        <p style="font-size:12px; color:#9ca3af; margin-bottom:4px;">🎙️ Cihaz Ses Motoru:</p>
        <select id="voiceSelect"></select>
        <div style="display:flex; gap:8px; justify-content:flex-end;">
            <button type="button" class="icon-btn" onclick="testCurrentVoice()">🔊 Dene</button>
            <button type="button" class="icon-btn" onclick="closeSettings()">Kapat</button>
            <button type="button" class="send-btn" onclick="saveSettings()">Kaydet</button>
        </div>
    </div>
</div>

<div class="modal" id="historyModal">
    <div class="modal-card">
        <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:12px;">
            <h3>🗂️ Sohbet Geçmişi</h3>
            <button type="button" class="send-btn" style="font-size:12px;" onclick="newChat()">+ Yeni</button>
        </div>
        <div id="historyList"></div>
        <div style="text-align:right; margin-top:10px;">
            <button type="button" class="icon-btn" onclick="document.getElementById('historyModal').style.display='none'">Kapat</button>
        </div>
    </div>
</div>
<script>
    let sessions = JSON.parse(localStorage.getItem("vuslat_sessions") || "[]");
    let currentSessionId = localStorage.getItem("vuslat_curr_id") || null;
    let apiKey = localStorage.getItem("vuslat_ai_key") || "";
    let savedVoiceName = localStorage.getItem("vuslat_voice_name") || "";
    let voiceProfile = localStorage.getItem("vuslat_voice_profile") || "deep_male";
    let attachedImageBase64 = null;
    let attachedMime = "image/jpeg";
    let recognition = null;
    let isListening = false;
    let isLiveCallActive = false;

    const personas = {
        general: "Senin adın Vuslat. Türkçe ve İngilizce dillerine hakim, zeki, hızlı ve samimi bir asistansın. Kullanıcı hangi dilde yazarsa o dilde net yanıt ver. Asla iç düşünce notu yazma.",
        english: "Senin adın Vuslat ve İngilizce öğretmenisin. Kullanıcıyla İngilizce pratik yap ve Türkçe açıklamalarla hatalarını düzelt.",
        coder: "Senin adın Vuslat ve yazılım mühendisisin. Temiz kodlar yaz ve kısa Türkçe açıklamalar ekle.",
        friend: "Senin adın Vuslat. Samimi, esprili ve kafa dengi bir arkadaş gibi konuş."
    };

    function populateVoices() {
        if (!("speechSynthesis" in window)) return;
        const sel = document.getElementById("voiceSelect");
        if (!sel) return;
        const voices = window.speechSynthesis.getVoices();
        sel.innerHTML = `<option value="">Otomatik Seçim</option>`;
        voices.forEach(v => {
            const opt = document.createElement("option");
            opt.value = v.name;
            opt.textContent = v.name + " (" + v.lang + ")";
            if (v.name === savedVoiceName) opt.selected = true;
            sel.appendChild(opt);
        });
    }
    if ("speechSynthesis" in window) {
        window.speechSynthesis.onvoiceschanged = populateVoices;
        setTimeout(populateVoices, 500);
    }

    function getCurrentSession() {
        let s = sessions.find(x => x.id === currentSessionId);
        if (!s) {
            s = { id: "s_" + Date.now(), title: "Yeni Sohbet", messages: [] };
            sessions.unshift(s);
            currentSessionId = s.id;
            saveSessions();
        }
        return s;
    }

    function saveSessions() {
        localStorage.setItem("vuslat_sessions", JSON.stringify(sessions.slice(0, 20)));
        localStorage.setItem("vuslat_curr_id", currentSessionId);
    }

    function newChat() {
        const s = { id: "s_" + Date.now(), title: "Yeni Sohbet", messages: [] };
        sessions.unshift(s);
        currentSessionId = s.id;
        saveSessions();
        document.getElementById("historyModal").style.display = "none";
        renderChat();
    }

    function openHistory() {
        const list = document.getElementById("historyList");
        list.innerHTML = "";
        sessions.forEach(s => {
            const div = document.createElement("div");
            div.className = "hist-item";
            div.innerHTML = `<span>💬 ${s.title}</span><span style="color:#ef4444;" onclick="deleteSession('${s.id}', event)">🗑️</span>`;
            div.onclick = () => { currentSessionId = s.id; saveSessions(); document.getElementById("historyModal").style.display = "none"; renderChat(); };
            list.appendChild(div);
        });
        document.getElementById("historyModal").style.display = "flex";
    }

    function deleteSession(id, e) {
        e.stopPropagation();
        sessions = sessions.filter(x => x.id !== id);
        if (currentSessionId === id) currentSessionId = sessions.at(0)?.id || null;
        saveSessions();
        openHistory();
        renderChat();
    }

    function openSettings() {
        populateVoices();
        document.getElementById("apiKeyInput").value = apiKey;
        document.getElementById("voiceGenderProfile").value = voiceProfile;
        document.getElementById("settingsModal").style.display = "flex";
    }
    function closeSettings() { document.getElementById("settingsModal").style.display = "none"; }
    function saveSettings() {
        apiKey = document.getElementById("apiKeyInput").value.trim();
        voiceProfile = document.getElementById("voiceGenderProfile").value;
        savedVoiceName = document.getElementById("voiceSelect").value;
        localStorage.setItem("vuslat_ai_key", apiKey);
        localStorage.setItem("vuslat_voice_profile", voiceProfile);
        localStorage.setItem("vuslat_voice_name", savedVoiceName);
        localStorage.removeItem("vuslat_fast_model");
        closeSettings();
        addMessage("ai", "Ayarların kaydedildi! 📞 Canlı Konuş ile sesli sohbet edebilirsin.");
    }
    function testCurrentVoice() {
        voiceProfile = document.getElementById("voiceGenderProfile").value;
        savedVoiceName = document.getElementById("voiceSelect").value;
        speakText("Merhaba! Ben Vuslat, ses tonum şu an bu şekilde duyuluyor.");
    }

    function speakText(text, onDone = null) {
        if (!("speechSynthesis" in window)) { if (onDone) onDone(); return; }
        window.speechSynthesis.cancel();
        const cleanText = text.replace(/[*#`_~]/g, "");
        const utter = new SpeechSynthesisUtterance(cleanText);
        const isTurkish = /[çğıöşüÇĞİÖŞÜ]/.test(cleanText);
        utter.lang = isTurkish ? "tr-TR" : "en-US";

        const voices = window.speechSynthesis.getVoices();
        const isMale = voiceProfile.includes("male");
        let chosen = voices.find(v => v.name === savedVoiceName);
        if (!chosen) {
            chosen = voices.find(v => v.lang.startsWith(isTurkish ? "tr" : "en") &&
                (isMale ? /ahmet|male|erkek|emre|mehmet|david|mark/i.test(v.name) : /emel|female|kadın|seda|yeliz|zira|jenny/i.test(v.name)));
        }
        if (chosen) utter.voice = chosen;

        if (voiceProfile === "deep_male") { utter.pitch = 0.58; utter.rate = 0.98; }
        else if (voiceProfile === "normal_male") { utter.pitch = 0.85; utter.rate = 1.0; }
        else if (voiceProfile === "natural_female") { utter.pitch = 1.05; utter.rate = 1.02; }
        else { utter.pitch = 1.22; utter.rate = 1.05; }

        utter.onend = () => { if (onDone) onDone(); };
        utter.onerror = () => { if (onDone) onDone(); };
        window.speechSynthesis.speak(utter);
    }

    function startLiveCall() {
        if (!apiKey) { alert("Önce ⚙️ Ayar butonundan API anahtarınızı girin."); return; }
        isLiveCallActive = true;
        document.getElementById("liveCallScreen").style.display = "flex";
        document.getElementById("callVoiceLabel").innerText = voiceProfile.includes("male") ? "Erkek Asistan Sesi" : "Kadın Asistan Sesi";
        listenInLiveCall();
    }

    function endLiveCall() {
        isLiveCallActive = false;
        if (recognition) recognition.stop();
        if ("speechSynthesis" in window) window.speechSynthesis.cancel();
        document.getElementById("liveCallScreen").style.display = "none";
    }

    function listenInLiveCall() {
        if (!isLiveCallActive) return;
        const SpeechRec = window.SpeechRecognition || window.webkitSpeechRecognition;
        if (!SpeechRec) { alert("Tarayıcınız sesli konuşmayı desteklemiyor."); endLiveCall(); return; }

        const orb = document.getElementById("callOrb");
        const status = document.getElementById("callStatusText");
        orb.innerText = "🎙️";
        orb.classList.add("pulse");
        status.innerText = "Seni dinliyorum...";

        recognition = new SpeechRec();
        recognition.lang = "tr-TR";
        recognition.interimResults = false;
        recognition.maxAlternatives = 1;

        recognition.onresult = async (e) => {
            const spoken = e.results.item(0).item(0).transcript;
            orb.classList.remove("pulse");
            orb.innerText = "⚡";
            status.innerText = `"${spoken}"`;
            addMessage("user", spoken);

            const reply = await askGeminiText(spoken, false, true);
            addMessage("ai", reply);

            if (!isLiveCallActive) return;
            orb.innerText = "🔊";
            orb.classList.add("pulse");
            status.innerText = reply;

            speakText(reply, () => { if (isLiveCallActive) listenInLiveCall(); });
        };
        recognition.onerror = () => { if (isLiveCallActive) setTimeout(listenInLiveCall, 300); };
        recognition.start();
    }
    function quickAsk(txt) {
        const input = document.getElementById("userInput");
        input.value = txt;
        input.focus();
    }

    function handleImageUpload(event) {
        const file = event.target.files.item(0);
        if (!file) return;
        attachedMime = file.type || "image/jpeg";
        const reader = new FileReader();
        reader.onload = (e) => {
            const fullDataUrl = e.target.result;
            attachedImageBase64 = fullDataUrl.split(",").at(1);
            document.getElementById("previewImg").src = fullDataUrl;
            document.getElementById("previewBar").style.display = "flex";
        };
        reader.readAsDataURL(file);
        event.target.value = "";
    }

    function clearAttachedImage() {
        attachedImageBase64 = null;
        document.getElementById("previewBar").style.display = "none";
    }

    function addMessage(role, text, imgUrl = null) {
        const s = getCurrentSession();
        if (role === "user" && s.messages.length === 0) s.title = text.slice(0, 26);
        s.messages.push({ role, text, imgUrl });
        saveSessions();
        renderChat();
    }

    function renderChat() {
        const box = document.getElementById("chatBox");
        const s = getCurrentSession();
        box.innerHTML = "";
        if (s.messages.length === 0) {
            box.innerHTML = `<div class="msg ai">Merhaba! Ben <b>Vuslat</b>. Üstteki <b>📞 Canlı Konuş</b> butonuna basarak sesli sohbet edebilir, <b>📷</b> ile fotoğrafını düzenletebilir veya <b>🎨 Çiz</b> ile görsel üretebilirsin.</div>`;
            return;
        }
        s.messages.forEach(m => {
            const div = document.createElement("div");
            div.className = "msg " + m.role;
            if (m.text) {
                const p = document.createElement("div");
                p.innerText = m.text;
                div.appendChild(p);
            }
            if (m.imgUrl) {
                const img = document.createElement("img");
                img.src = m.imgUrl;
                div.appendChild(img);
            }
            if (m.role === "ai") {
                const acts = document.createElement("div");
                acts.className = "msg-actions";
                if (m.text) {
                    const sp = document.createElement("span");
                    sp.className = "act-tag";
                    sp.innerText = "🔊 Dinle";
                    sp.onclick = () => speakText(m.text);
                    acts.appendChild(sp);

                    const cp = document.createElement("span");
                    cp.className = "act-tag";
                    cp.innerText = "📋 Kopyala";
                    cp.onclick = () => { navigator.clipboard.writeText(m.text); cp.innerText = "✓ Kopyalandı"; };
                    acts.appendChild(cp);
                }
                if (m.imgUrl) {
                    const dl = document.createElement("a");
                    dl.className = "act-tag";
                    dl.href = m.imgUrl;
                    dl.download = "vuslat-gorsel.png";
                    dl.target = "_blank";
                    dl.innerText = "⬇️ İndir";
                    acts.appendChild(dl);
                }
                div.appendChild(acts);
            }
            box.appendChild(div);
        });
        box.scrollTop = box.scrollHeight;
    }
    async function triggerImageGen() {
        const input = document.getElementById("userInput");
        const promptText = input.value.trim();
        if (!promptText) { input.placeholder = "Önce çizdirmek istediğin şeyi yaz..."; input.focus(); return; }
        input.value = "";
        addMessage("user", "🎨 Çiz: " + promptText);

        let engPrompt = promptText;
        if (apiKey) {
            try {
                const trRes = await askGeminiText("Translate to detailed English image prompt, output ONLY English: " + promptText, true, true);
                if (trRes && !trRes.includes("yoğun")) engPrompt = trRes.trim();
            } catch (e) {}
        }

        const seed = Math.floor(Math.random() * 999999);
        const imgApi = atob("aHR0cHM6Ly9pbWFnZS5wb2xsaW5hdGlvbnMuYWkvcHJvbXB0Lw==");
        const finalImgUrl = `${imgApi}${encodeURIComponent(engPrompt)}?width=1024&height=1024&seed=${seed}&model=flux&enhance=true&nologo=true`;
        addMessage("ai", `"${promptText}"`, finalImgUrl);
    }

    async function editUploadedImage(promptText, imgBase64, mimeType) {
        const apiBase = atob("aHR0cHM6Ly9nZW5lcmF0aXZlbGFuZ3VhZ2UuZ29vZ2xlYXBpcy5jb20vdjFiZXRhLw==");
        const listRes = await fetch(`${apiBase}models?key=${encodeURIComponent(apiKey)}`);
        const listData = await listRes.json();
        const imgModels = (listData.models || []).filter(m =>
            m.supportedGenerationMethods?.includes("generateContent") &&
            !m.name.includes("1.5") && !m.name.includes("2.5") && !m.name.includes("2.0")
        );

        const editInstruction = `Edit this exact photo while preserving the person's face and identity. Request: ${promptText}`;

        for (const m of imgModels) {
            const url = `${apiBase}${m.name}:generateContent?key=${encodeURIComponent(apiKey)}`;
            const res = await fetch(url, {
                method: "POST",
                headers: { "Content-Type": "application/json" },
                body: JSON.stringify({
                    contents: [{ parts: [{ text: editInstruction }, { inlineData: { mimeType: mimeType, data: imgBase64 } }] }],
                    generationConfig: { responseModalities: ["IMAGE", "TEXT"] }
                })
            });
            const data = await res.json();
            const parts = data.candidates?.at(0)?.content?.parts || [];
            const imgPart = parts.find(p => p.inlineData && p.inlineData.data);
            const txtPart = parts.find(p => !p.thought && p.text);
            if (imgPart) {
                return { text: txtPart?.text || "Düzenleme tamamlandı:", imgUrl: `data:${imgPart.inlineData.mimeType || "image/png"};base64,${imgPart.inlineData.data}` };
            }
        }
        return { text: "Bu model şu an görsel düzenleme döndürmedi, farklı bir komutla tekrar dene.", imgUrl: null };
    }

    async function askGeminiText(text, rawTranslate = false, isVoiceMode = false) {
        const apiBase = atob("aHR0cHM6Ly9nZW5lcmF0aXZlbGFuZ3VhZ2UuZ29vZ2xlYXBpcy5jb20vdjFiZXRhLw==");
        let savedModel = localStorage.getItem("vuslat_fast_model");
        const mode = document.getElementById("personaSelect").value;
        const sysPrompt = rawTranslate
            ? "You are a translator."
            : (isVoiceMode ? personas[mode] + " Kısa, doğal ve akıcı konuşma diliyle cevap ver." : personas[mode]);

        const s = getCurrentSession();
        const sliceCount = isVoiceMode ? -2 : -6;
        const historyParts = rawTranslate ? [] : s.messages.slice(sliceCount, -1).filter(m => m.text).map(m => ({
            role: m.role === "user" ? "user" : "model",
            parts: [{ text: m.text }]
        }));
        historyParts.push({ role: "user", parts: [{ text: text }] });

        const extractReply = (data) => {
            const parts = data.candidates?.at(0)?.content?.parts || [];
            const realPart = parts.find(p => !p.thought && p.text);
            return realPart?.text?.trim() || "Buyur, seni dinliyorum.";
        };

        const callModel = async (m, noThink = true) => {
            const bodyObj = {
                systemInstruction: { parts: [{ text: sysPrompt }] },
                contents: historyParts,
                generationConfig: { maxOutputTokens: isVoiceMode ? 220 : 800, temperature: 0.7 }
            };
            if (noThink) bodyObj.generationConfig.thinkingConfig = { thinkingBudget: 0 };
            return await fetch(`${apiBase}${m}:generateContent?key=${encodeURIComponent(apiKey)}`, {
                method: "POST",
                headers: { "Content-Type": "application/json" },
                body: JSON.stringify(bodyObj)
            });
        };

        if (savedModel) {
            let res = await callModel(savedModel, true);
            if (!res.ok) res = await callModel(savedModel, false);
            const data = await res.json();
            if (res.ok && data.candidates) return extractReply(data);
        }

        const listRes = await fetch(`${apiBase}models?key=${encodeURIComponent(apiKey)}`);
        const listData = await listRes.json();
        const activeModels = (listData.models || [])
            .filter(m => m.supportedGenerationMethods?.includes("generateContent") && !m.name.includes("1.5") && !m.name.includes("2.5") && !m.name.includes("2.0"))
            .sort((a, b) => (b.name.includes("lite") ? 1 : 0) - (a.name.includes("lite") ? 1 : 0));

        for (const m of activeModels) {
            let res = await callModel(m.name, true);
            if (!res.ok) res = await callModel(m.name, false);
            const data = await res.json();
            if (res.ok && data.candidates) {
                localStorage.setItem("vuslat_fast_model", m.name);
                return extractReply(data);
            }
        }
        return "Sunucu şu an yoğun, tekrar dene.";
    }

    async function sendMessage() {
        const input = document.getElementById("userInput");
        const text = input.value.trim();
        if (!text && !attachedImageBase64) return;
        const imgData = attachedImageBase64;
        const imgMime = attachedMime;
        const previewSrc = imgData ? document.getElementById("previewImg").src : null;

        input.value = "";
        clearAttachedImage();
        addMessage("user", text || "Fotoğrafı düzenle", previewSrc);

        if (!apiKey) { addMessage("ai", "Önce ⚙️ Ayar butonundan API anahtarını gir."); return; }

        const box = document.getElementById("chatBox");
        const loadingDiv = document.createElement("div");
        loadingDiv.className = "msg ai";
        loadingDiv.innerText = imgData ? "🎨 Fotoğrafın düzenleniyor..." : "⚡ Vuslat yazıyor...";
        box.appendChild(loadingDiv);
        box.scrollTop = box.scrollHeight;

        try {
            if (imgData) {
                const resObj = await editUploadedImage(text || "Enhance photo", imgData, imgMime);
                loadingDiv.remove();
                addMessage("ai", resObj.text, resObj.imgUrl);
            } else {
                const reply = await askGeminiText(text, false, false);
                loadingDiv.remove();
                addMessage("ai", reply);
            }
        } catch (e) {
            loadingDiv.remove();
            addMessage("ai", "Bağlantı hatası oluştu.");
        }
    }

    function toggleVoice() {
        const SpeechRec = window.SpeechRecognition || window.webkitSpeechRecognition;
        if (!SpeechRec) { alert("Tarayıcınız sesli giriş desteklemiyor."); return; }
        if (isListening && recognition) { recognition.stop(); return; }
        recognition = new SpeechRec();
        recognition.lang = "tr-TR";
        recognition.onstart = () => { isListening = true; document.getElementById("micBtn").classList.add("listening"); };
        recognition.onend = () => { isListening = false; document.getElementById("micBtn").classList.remove("listening"); };
        recognition.onresult = (e) => { document.getElementById("userInput").value = e.results.item(0).item(0).transcript; sendMessage(); };
        recognition.start();
    }

    renderChat();
</script>
</body>
</html>
