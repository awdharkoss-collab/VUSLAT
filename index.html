<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>VUSLAT AI • Ultimate Vision Pro</title>
    <style>
        :root { --bg: #070b14; --panel: #0f172a; --accent: #38bdf8; --purple: #8b5cf6; --text: #f1f5f9; }
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', Roboto, sans-serif; }
        html, body { width: 100%; height: 100dvh; background: var(--bg); color: var(--text); display: flex; flex-direction: column; overflow: hidden; }
        header { background: var(--panel); padding: 8px 12px; display: flex; align-items: center; justify-content: space-between; border-bottom: 1px solid rgba(56,189,248,0.25); gap: 6px; }
        .brand { font-size: 14px; font-weight: 900; color: var(--accent); white-space: nowrap; }
        .top-btns { display: flex; gap: 5px; align-items: center; overflow-x: auto; scrollbar-width: none; }
        .top-btns::-webkit-scrollbar { display: none; }
        .chip { background: #1e293b; color: #e2e8f0; border: 1px solid rgba(56,189,248,0.3); padding: 5px 8px; border-radius: 8px; font-size: 11px; font-weight: 700; cursor: pointer; white-space: nowrap; flex-shrink: 0; }
        .chip.live { background: #10b981; color: #052e16; border: none; }
        .modes { display: flex; gap: 6px; overflow-x: auto; padding: 7px 10px; background: #0b1120; border-bottom: 1px solid rgba(255,255,255,0.06); scrollbar-width: none; }
        .modes::-webkit-scrollbar { display: none; }
        .mode-btn { background: #1e293b; color: #cbd5e1; border: 1px solid transparent; padding: 5px 9px; border-radius: 9px; font-size: 11px; font-weight: 700; white-space: nowrap; cursor: pointer; flex-shrink: 0; }
        .mode-btn.active { background: rgba(56,189,248,0.16); color: var(--accent); border-color: var(--accent); }
        .vision-bar { display: flex; gap: 5px; overflow-x: auto; padding: 6px 10px; background: #091224; border-bottom: 1px solid rgba(139,92,246,0.25); scrollbar-width: none; align-items: center; }
        .vision-bar::-webkit-scrollbar { display: none; }
        .v-chip { background: rgba(139,92,246,0.15); color: #c4b5fd; border: 1px solid rgba(139,92,246,0.4); padding: 4px 8px; border-radius: 7px; font-size: 10px; font-weight: 800; white-space: nowrap; cursor: pointer; flex-shrink: 0; }
        .v-chip.active { background: #8b5cf6; color: #fff; }
        .chat { flex: 1; overflow-y: auto; padding: 12px; display: flex; flex-direction: column; gap: 10px; }
        .msg { max-width: 88%; padding: 11px 14px; border-radius: 14px; font-size: 14px; line-height: 1.55; word-wrap: break-word; }
        .msg.user { align-self: flex-end; background: linear-gradient(135deg, #2563eb, #7c3aed); color: #fff; border-bottom-right-radius: 4px; }
        .msg.bot { align-self: flex-start; background: var(--panel); border: 1px solid rgba(56,189,248,0.25); border-bottom-left-radius: 4px; }
        .msg img { max-width: 100%; border-radius: 10px; margin-top: 6px; display: block; }
        .bar { background: var(--panel); padding: 8px 10px; display: flex; align-items: center; gap: 6px; border-top: 1px solid rgba(56,189,248,0.25); }
        .icon-btn { background: #1e293b; color: #fff; border: none; width: 36px; height: 36px; border-radius: 10px; font-size: 15px; cursor: pointer; flex-shrink: 0; }
        input[type="text"], textarea { flex: 1; min-width: 0; background: #070b14; color: #fff; border: 1px solid #334155; padding: 9px 11px; border-radius: 12px; font-size: 13px; outline: none; }
        .send-btn { background: linear-gradient(135deg, #38bdf8, #8b5cf6); color: #070b14; border: none; padding: 0 13px; height: 36px; border-radius: 12px; font-weight: 900; font-size: 12px; cursor: pointer; flex-shrink: 0; }
        .modal { display: none; position: fixed; inset: 0; background: rgba(0,0,0,0.85); z-index: 99; align-items: center; justify-content: center; padding: 16px; }
        .modal-card { background: var(--panel); border: 1px solid var(--accent); border-radius: 16px; padding: 18px; width: 100%; max-width: 380px; }
    </style>
</head>
<body>
<header>
    <div class="brand">⚡ VUSLAT AI</div>
    <div class="top-btns">
        <button type="button" class="chip" onclick="openCharacter()">🏛️ Tarihi Karakter</button>
        <button type="button" class="chip" onclick="openModal('memModal')">🧠 Hafıza</button>
        <button type="button" class="chip live" id="liveBtn" onclick="toggleLiveVoice()">🎙️ Canlı</button>
        <button type="button" class="chip" onclick="openModal('setModal')">⚙️ Ayar</button>
    </div>
</header>

<div class="modes">
    <button type="button" class="mode-btn active" onclick="setMode(this, 'Sen Vuslat adlı Türkçe konuşan zeki ve pratik bir kişisel asistansın.')">🤖 Genel Asistan</button>
    <button type="button" class="mode-btn" onclick="setMode(this, 'Sen derin veri analisti ve araştırmacısın. Detaylı ve maddeli yanıt ver.')">📊 Derin Analiz</button>
    <button type="button" class="mode-btn" onclick="setMode(this, 'Sen bilgi yarışması sunucususun. Kullanıcıya şıklı genel kültür soruları sor ve puanla.')">🏆 Bilgi Yarışması</button>
    <button type="button" class="mode-btn" onclick="setMode(this, 'Sen interaktif metin tabanlı macera oyunu yöneticisisin. Seçenekler sunarak hikayeyi ilerlet.')">⚔️ Macera Oyunu</button>
    <button type="button" class="mode-btn" onclick="setMode(this, 'Sen usta bir rüya tabircisisin. Sembolleri Türkçe yorumla.')">🔮 Rüya Tabiri</button>
    <button type="button" class="mode-btn" onclick="setMode(this, 'Sen viral Reels ve TikTok senaristisin. Etkileyici kısa senaryo yaz.')">🎬 Reels Senaryosu</button>
    <button type="button" class="mode-btn" onclick="setMode(this, 'Sen zihin haritası ve strateji uzmanısın. Konuyu dallara ayır.')">🧠 Zihin Haritası</button>
    <button type="button" class="mode-btn" onclick="setMode(this, 'Sen ilişki ve mesaj analistisin. Gönderilen mesajların alt metnini analiz et.')">💬 Mesaj Analizi</button>
</div>

<div class="vision-bar">
    <span style="font-size:10px; color:#94a3b8; font-weight:800; white-space:nowrap;">👁️ GÖRÜNTÜ MODU:</span>
    <button type="button" class="v-chip active" onclick="setVisionMode(this, 'Bu görseli en ince ayrıntısına kadar Türkçe analiz et; üzerindeki tüm yazıları, logoları, nesneleri ve bağlamı net bir şekilde açıkla.')">🔍 Ultra Analiz</button>
    <button type="button" class="v-chip" onclick="setVisionMode(this, 'Bu görseldeki TÜM metinleri ve sayıları eksiksiz, satır satır oku ve yaz (OCR).')">📝 Metin Oku (OCR)</button>
    <button type="button" class="v-chip" onclick="setVisionMode(this, 'Bu görseldeki soruyu veya problemi adım adım çöz ve doğru cevabı açıkla.')">🧮 Soru / Ödev Çöz</button>
    <button type="button" class="v-chip" onclick="setVisionMode(this, 'Bu görseldeki oyunu, filmi, ürünü veya karakteri tanı; adını, türünü ve önemli detaylarını Türkçe anlat.')">🎮 Oyun / Ürün Tanı</button>
    <button type="button" class="v-chip" onclick="setVisionMode(this, 'Bu görseldeki yabancı dildeki tüm yazıları doğal Türkçeye çevir.')">🌐 Türkçeye Çevir</button>
</div>
<div class="chat" id="chatBox">
    <div class="msg bot">Merhaba! Tüm modlar, Hafıza, Canlı Ses ve **Ultra Görüntü Analizi** hazır. Fotoğraf atabilir, çizim isteyebilir veya soru sorabilirsin.</div>
</div>

<div class="bar">
    <input type="file" id="imgInput" accept="image/*" style="display:none;" onchange="handleImageUpload(event)">
    <button type="button" class="icon-btn" title="Fotoğraf Analiz Et" onclick="document.getElementById('imgInput').click()">📷</button>
    <button type="button" class="icon-btn" title="Sesle Yaz" onclick="startDictation()">🎤</button>
    <input type="text" id="msgInput" placeholder="Sor, çizdir veya fotoğraf at..." onkeydown="if(event.key==='Enter') sendMessage()">
    <button type="button" class="icon-btn" style="background:#0ea5e9; color:#070b14; font-weight:900; font-size:12px;" onclick="generateImage()">🎨 Çiz</button>
    <button type="button" class="send-btn" onclick="sendMessage()">Gönder</button>
</div>

<div class="modal" id="memModal">
    <div class="modal-card">
        <h3 style="color:var(--accent); margin-bottom:8px;">🧠 Vuslat Kalıcı Hafıza</h3>
        <p style="font-size:11px; color:#94a3b8; margin-bottom:8px;">Buraya yazdığın bilgileri Vuslat her sohbette hatırlar:</p>
        <textarea id="memInput" rows="4" style="width:100%; margin-bottom:10px;" placeholder="Örn: Adım Ahmet, İstanbul'da yaşıyorum, kısa ve net cevapları severim..."></textarea>
        <div style="display:flex; gap:8px; justify-content:flex-end;">
            <button type="button" class="chip" onclick="closeModal('memModal')">Kapat</button>
            <button type="button" class="send-btn" onclick="saveMemory()">Kaydet</button>
        </div>
    </div>
</div>

<div class="modal" id="setModal">
    <div class="modal-card">
        <h3 style="color:var(--accent); margin-bottom:8px;">⚙️ Ayarlar</h3>
        <div style="display:flex; flex-direction:column; gap:8px; margin-bottom:12px;">
            <button type="button" class="chip" onclick="toggleVoice()">🔊 Sesli Yanıtı Aç / Kapat</button>
            <button type="button" class="chip" style="border-color:#ef4444; color:#fca5a5;" onclick="clearChat()">🗑️ Sohbet Geçmişini Temizle</button>
        </div>
        <button type="button" class="send-btn" style="width:100%;" onclick="closeModal('setModal')">Tamam</button>
    </div>
</div>
<script>
    let systemPrompt = "Sen Vuslat adlı Türkçe konuşan zeki ve pratik bir kişisel asistansın.";
    let visionPrompt = "Bu görseli en ince ayrıntısına kadar Türkçe analiz et; üzerindeki tüm yazıları, logoları, nesneleri ve bağlamı net bir şekilde açıkla.";
    let chatHistory = [];
    let voiceEnabled = false;
    let liveMode = false;
    let userMemory = localStorage.getItem("vuslat_mem") || "";

    function addMsg(html, sender) {
        const box = document.getElementById("chatBox");
        const div = document.createElement("div");
        div.className = "msg " + sender;
        div.innerHTML = html;
        box.appendChild(div);
        box.scrollTop = box.scrollHeight;
        return div;
    }

    function setMode(btn, prompt) {
        document.querySelectorAll(".mode-btn").forEach(b => b.classList.remove("active"));
        btn.classList.add("active");
        systemPrompt = prompt;
    }

    function setVisionMode(btn, prompt) {
        document.querySelectorAll(".v-chip").forEach(b => b.classList.remove("active"));
        btn.classList.add("active");
        visionPrompt = prompt;
    }

    function openModal(id) {
        if (id === "memModal") document.getElementById("memInput").value = userMemory;
        document.getElementById(id).style.display = "flex";
    }
    function closeModal(id) { document.getElementById(id).style.display = "none"; }
    function saveMemory() {
        userMemory = document.getElementById("memInput").value.trim();
        localStorage.setItem("vuslat_mem", userMemory);
        closeModal("memModal");
        addMsg("🧠 Hafıza güncellendi.", "bot");
    }

    function openCharacter() {
        const charName = prompt("Hangi tarihi karakterle sohbet etmek istersin? (Örn: Fatih Sultan Mehmet, Atatürk, Nikola Tesla, İbn-i Sina)");
        if (!charName) return;
        systemPrompt = `Sen ${charName} karakterisin. Kendi döneminin üslubuyla ama anlaşılır, etkileyici bir Türkçe ile birinci ağızdan konuş.`;
        addMsg(`🏛️ **${charName}** ile canlı bağlantı kuruldu. Sorunu sorabilirsin!`, "bot");
    }

    async function enhanceAndCompressImage(file) {
        return new Promise((resolve, reject) => {
            const img = new Image();
            const url = URL.createObjectURL(file);
            img.onload = () => {
                URL.revokeObjectURL(url);
                const maxDim = 800;
                let w = img.width, h = img.height;
                if (w > maxDim || h > maxDim) {
                    if (w > h) { h = Math.round((h * maxDim) / w); w = maxDim; }
                    else { w = Math.round((w * maxDim) / h); h = maxDim; }
                }
                const canvas = document.createElement("canvas");
                canvas.width = w;
                canvas.height = h;
                const ctx = canvas.getContext("2d");
                ctx.filter = "contrast(1.08) saturate(1.05)";
                ctx.drawImage(img, 0, 0, w, h);
                resolve(canvas.toDataURL("image/jpeg", 0.72));
            };
            img.onerror = () => { URL.revokeObjectURL(url); reject(new Error("Görsel okunamadı")); };
            img.src = url;
        });
    }

    async function handleImageUpload(e) {
        const file = e.target.files.at(0);
        if (!file) return;
        const promptInput = document.getElementById("msgInput");
        const customText = promptInput.value.trim();
        const finalVisionPrompt = customText ? `${visionPrompt} Kullanıcı notu: ${customText}` : visionPrompt;
        promptInput.value = "";
        e.target.value = "";

        const compressedUrl = await enhanceAndCompressImage(file);
        addMsg(`${customText || "📷 Görsel Analizi"}<img src="${compressedUrl}">`, "user");
        const waitBubble = addMsg("⚡ Ultra Vision motoru görseli paralel tarıyor...", "bot");

        const apiHost = atob("aHR0cHM6Ly90ZXh0LnBvbGxpbmF0aW9uLmFpL29wZW5haQ==");
        const models = new Array("openai", "openai-large");

        const raceTasks = models.map(async (modelName) => {
            const res = await fetch(apiHost, {
                method: "POST",
                headers: { "Content-Type": "application/json" },
                body: JSON.stringify({
                    model: modelName,
                    max_tokens: 800,
                    messages: [{
                        role: "user",
                        content: [
                            { type: "text", text: finalVisionPrompt },
                            { type: "image_url", image_url: { url: compressedUrl } }
                        ]
                    }]
                }),
                signal: AbortSignal.timeout(14000)
            });
            if (!res.ok) throw new Error("HTTP " + res.status);
            const data = await res.json();
            const reply = data?.choices?.at(0)?.message?.content;
            if (!reply || !reply.trim()) throw new Error("Boş yanıt");
            return reply.trim();
        });

        try {
            const fastestReply = await Promise.any(raceTasks);
            waitBubble.innerText = fastestReply;
            if (voiceEnabled || liveMode) speakText(fastestReply);
        } catch (err) {
            waitBubble.innerText = "Görsel analiz sunucuları şu an yoğun, lütfen birkaç saniye sonra tekrar dene.";
        }
    }
    function speakText(txt) {
        if (!("speechSynthesis" in window)) return;
        speechSynthesis.cancel();
        const u = new SpeechSynthesisUtterance(txt.replace(/[*#_]/g, ""));
        u.lang = "tr-TR";
        speechSynthesis.speak(u);
    }

    function toggleVoice() {
        voiceEnabled = !voiceEnabled;
        alert(voiceEnabled ? "🔊 Sesli okuma açıldı." : "🔇 Sesli okuma kapatıldı.");
    }

    function toggleLiveVoice() {
        liveMode = !liveMode;
        const btn = document.getElementById("liveBtn");
        btn.style.background = liveMode ? "#ef4444" : "#10b981";
        btn.style.color = liveMode ? "#fff" : "#052e16";
        btn.innerText = liveMode ? "🔴 Canlı Açık" : "🎙️ Canlı";
        if (liveMode) startDictation(true);
    }

    function startDictation(autoSend = false) {
        const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
        if (!SR) { alert("Tarayıcı sesle yazmayı desteklemiyor."); return; }
        const rec = new SR();
        rec.lang = "tr-TR";
        rec.onresult = (e) => {
            const spoken = e.results.at(0)?.at(0)?.transcript || "";
            document.getElementById("msgInput").value = spoken;
            if (autoSend || liveMode) sendMessage();
        };
        rec.start();
    }

    function clearChat() {
        chatHistory = [];
        document.getElementById("chatBox").innerHTML = `<div class="msg bot">Sohbet temizlendi. Hazırım!</div>`;
    }

    async function sendMessage() {
        const input = document.getElementById("msgInput");
        const text = input.value.trim();
        if (!text) return;
        input.value = "";
        addMsg(text, "user");
        chatHistory.push({ role: "user", content: text });
        if (chatHistory.length > 8) chatHistory = chatHistory.slice(-8);

        const waitBubble = addMsg("⏳ Yazıyor...", "bot");
        const apiHost = atob("aHR0cHM6Ly90ZXh0LnBvbGxpbmF0aW9uLmFpL29wZW5haQ==");
        const fullSystem = userMemory ? `${systemPrompt} Kullanıcı hakkında kalıcı hafıza: ${userMemory}` : systemPrompt;

        try {
            const res = await fetch(apiHost, {
                method: "POST",
                headers: { "Content-Type": "application/json" },
                body: JSON.stringify({
                    model: "openai",
                    messages: [{ role: "system", content: fullSystem }, ...chatHistory]
                }),
                signal: AbortSignal.timeout(12000)
            });
            const data = await res.json();
            const reply = data?.choices?.at(0)?.message?.content || "Yanıt alınamadı.";
            waitBubble.innerText = reply;
            chatHistory.push({ role: "assistant", content: reply });
            if (voiceEnabled || liveMode) speakText(reply);
        } catch (e) {
            waitBubble.innerText = "Bağlantı zaman aşımına uğradı, tekrar dene.";
        }
    }

    function generateImage() {
        const input = document.getElementById("msgInput");
        const prompt = input.value.trim();
        if (!prompt) { alert("Çizdirmek istediğin şeyi yaz!"); return; }
        input.value = "";
        addMsg("🎨 Çiziliyor: " + prompt, "user");
        const imgHost = atob("aHR0cHM6Ly9pbWFnZS5wb2xsaW5hdGlvbnMuYWkvcHJvbXB0Lw==");
        const url = `${imgHost}${encodeURIComponent(prompt)}?width=768&height=768&nologo=true&seed=${Date.now()}`;
        addMsg(`<img src="${url}" alt="Vuslat AI">`, "bot");
    }
</script>
</body>
</html>
