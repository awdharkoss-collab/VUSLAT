<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>VUSLAT AI • Süper Asistan</title>
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="VUSLAT">
    <link rel="apple-touch-icon" href="logo.png">
    <style>
        :root { --bg: #090a0f; --panel: #13151f; --card: #1b1e2b; --accent: #7c3aed; --cyan: #06b6d4; --text: #f3f4f6; }
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', Roboto, sans-serif; }
        body { background: var(--bg); color: var(--text); height: 100vh; display: flex; flex-direction: column; overflow: hidden; }
        header { background: var(--panel); padding: 12px 14px; display: flex; align-items: center; gap: 8px; border-bottom: 1px solid rgba(255,255,255,0.08); }
        .logo { font-size: 20px; font-weight: 900; background: linear-gradient(90deg, #a78bfa, #22d3ee); -webkit-background-clip: text; -webkit-text-fill-color: transparent; letter-spacing: 1px; }
        .mode-sel { background: #1e2130; color: #fff; border: 1px solid rgba(124,58,237,0.5); padding: 6px 8px; border-radius: 8px; font-size: 12px; font-weight: 700; outline: none; max-width: 145px; }
        .header-btns { margin-left: auto; display: flex; gap: 6px; }
        .icon-btn { background: #1f2230; color: #fff; border: 1px solid rgba(255,255,255,0.12); padding: 6px 10px; border-radius: 8px; font-size: 12px; font-weight: 700; cursor: pointer; white-space: nowrap; }
        .icon-btn.active { background: var(--accent); border-color: var(--accent); }
        .chips { display: flex; gap: 8px; overflow-x: auto; padding: 9px 14px; background: #0d0f16; border-bottom: 1px solid rgba(255,255,255,0.05); scrollbar-width: none; }
        .chips::-webkit-scrollbar { display: none; }
        .chip { background: #181b28; color: #d1d5db; border: 1px solid rgba(255,255,255,0.1); padding: 5px 11px; border-radius: 16px; font-size: 12px; white-space: nowrap; cursor: pointer; }
        .chip.art { border-color: #06b6d4; color: #67e8f9; }
        .chat-box { flex: 1; overflow-y: auto; padding: 14px; display: flex; flex-direction: column; gap: 14px; }
        .msg { max-width: 88%; padding: 12px 15px; border-radius: 14px; font-size: 14px; line-height: 1.55; word-wrap: break-word; white-space: pre-wrap; }
        .msg.user { align-self: flex-end; background: linear-gradient(135deg, #7c3aed, #5b21b6); color: #fff; border-bottom-right-radius: 4px; }
        .msg.ai { align-self: flex-start; background: var(--panel); border: 1px solid rgba(255,255,255,0.08); color: #e5e7eb; border-bottom-left-radius: 4px; }
        .msg img { max-width: 100%; border-radius: 10px; margin-top: 8px; display: block; border: 1px solid rgba(255,255,255,0.15); }
        .msg-actions { display: flex; gap: 12px; margin-top: 8px; padding-top: 6px; border-top: 1px solid rgba(255,255,255,0.06); }
        .act-tag { font-size: 11px; color: #38bdf8; cursor: pointer; font-weight: 700; text-decoration: none; }
        .preview-bar { display: none; background: #181b28; padding: 8px 14px; align-items: center; gap: 10px; border-top: 1px solid rgba(255,255,255,0.1); }
        .preview-bar img { height: 46px; width: 46px; object-fit: cover; border-radius: 6px; }
        .input-bar { background: var(--panel); padding: 10px 12px; display: flex; gap: 6px; align-items: center; border-top: 1px solid rgba(255,255,255,0.08); }
        .text-in { flex: 1; background: #1d202e; border: 1px solid rgba(255,255,255,0.15); color: #fff; padding: 10px 14px; border-radius: 22px; font-size: 14px; outline: none; min-width: 80px; }
        .round-btn { background: #1f2230; color: #fff; border: 1px solid rgba(255,255,255,0.15); width: 38px; height: 38px; border-radius: 50%; font-size: 16px; cursor: pointer; flex-shrink: 0; }
        .round-btn.listening { background: #ef4444; border-color: #ef4444; }
        .art-btn { background: linear-gradient(135deg, #06b6d4, #0284c7); color: #fff; border: none; padding: 0 12px; height: 38px; border-radius: 20px; font-weight: 800; font-size: 12px; cursor: pointer; white-space: nowrap; flex-shrink: 0; }
        .send-btn { background: var(--accent); color: #fff; border: none; padding: 0 15px; height: 38px; border-radius: 20px; font-weight: 700; font-size: 13px; cursor: pointer; flex-shrink: 0; }
        .modal { display: none; position: fixed; inset: 0; background: rgba(0,0,0,0.88); z-index: 999; align-items: center; justify-content: center; padding: 20px; }
        .modal-card { background: var(--panel); border: 1px solid var(--accent); border-radius: 14px; padding: 20px; width: 100%; max-width: 440px; max-height: 85vh; overflow-y: auto; }
        .modal-card input, .modal-card select { width: 100%; background: #0d0f16; color: #fff; border: 1px solid #333; padding: 10px; border-radius: 8px; margin-bottom: 12px; font-size: 13px; outline: none; }
        .hist-item { background: #1b1e2b; padding: 10px; border-radius: 8px; margin-bottom: 8px; display: flex; justify-content: space-between; align-items: center; cursor: pointer; font-size: 13px; }
    </style>
</head>
<body>
<header>
    <button type="button" class="icon-btn" onclick="openHistory()">☰</button>
    <div class="logo">VUSLAT</div>
    <select id="personaSelect" class="mode-sel" onchange="changePersona()">
        <option value="general">🤖 Genel Asistan</option>
        <option value="english">🇬🇧 İngilizce Hocası</option>
        <option value="coder">💻 Yazılım Uzmanı</option>
        <option value="friend">😎 Esprili Arkadaş</option>
    </select>
    <div class="header-btns">
        <button type="button" id="autoSpeakBtn" class="icon-btn" onclick="toggleAutoSpeak()">🔇 Oto-Ses</button>
        <button type="button" class="icon-btn" onclick="openSettings()">⚙️ API</button>
    </div>
</header>

<div class="chips">
    <div class="chip art" onclick="generateImagePrompt('Fütüristik İstanbul Boğazı, gece neon ışıkları, 4k sinematik')">🎨 İstanbul Çiz</div>
    <div class="chip art" onclick="generateImagePrompt('Uzayda gitar çalan astronot kedi, dijital sanat')">🎨 Astronot Kedi Çiz</div>
    <div class="chip" onclick="quickAsk('Bu fotoğrafta ne görüyorsun? Detaylı açıkla.')">📷 Fotoğraf Yorumla</div>
    <div class="chip" onclick="quickAsk('Benimle İngilizce sohbet et ve hatalarımı düzelt.')">🇬🇧 İngilizce Pratik</div>
    <div class="chip" onclick="quickAsk('Bana bugün için verimli bir plan hazırla.')">📅 Günlük Plan</div>
</div>

<div class="chat-box" id="chatBox"></div>

<div class="preview-bar" id="previewBar">
    <img id="previewImg" src="">
    <span style="font-size:12px; color:#9ca3af; flex:1;">Fotoğraf eklendi (Soru yazıp Gönder'e basın)</span>
    <button type="button" class="icon-btn" onclick="clearAttachedImage()">✕</button>
</div>

<div class="input-bar">
    <input type="file" id="imgInput" accept="image/*" style="display:none" onchange="handleImageUpload(event)">
    <button type="button" class="round-btn" title="Fotoğraf Yükle" onclick="document.getElementById('imgInput').click()">📷</button>
    <button type="button" id="micBtn" class="round-btn" title="Sesli Konuş" onclick="toggleVoice()">🎤</button>
    <input type="text" id="userInput" class="text-in" placeholder="Sor veya çizdir..." onkeyup="if(event.key==='Enter') sendMessage()">
    <button type="button" class="art-btn" onclick="triggerImageGen()">🎨 Çiz</button>
    <button type="button" class="send-btn" onclick="sendMessage()">Gönder</button>
</div>

<div class="modal" id="settingsModal">
    <div class="modal-card">
        <h3 style="margin-bottom:10px;">⚙️ Vuslat API Ayarı</h3>
        <p style="font-size:12px; color:#9ca3af; margin-bottom:12px;">Google AI Studio'dan aldığınız ücretsiz Gemini API anahtarını girin.</p>
        <input type="password" id="apiKeyInput" placeholder="API Anahtarınızı yapıştırın (AIza...)">
        <div style="display:flex; gap:10px; justify-content:flex-end;">
            <button type="button" class="icon-btn" onclick="closeSettings()">Kapat</button>
            <button type="button" class="send-btn" onclick="saveSettings()">Kaydet</button>
        </div>
    </div>
</div>

<div class="modal" id="historyModal">
    <div class="modal-card">
        <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:12px;">
            <h3>🗂️ Sohbet Geçmişi</h3>
            <button type="button" class="send-btn" style="height:32px; font-size:12px;" onclick="newChat()">+ Yeni Sohbet</button>
        </div>
        <div id="historyList"></div>
        <div style="text-align:right; margin-top:10px;">
            <button type="button" class="icon-btn" onclick="document.getElementById('historyModal').style.display='none'">Kapat</button>
        </div>
    </div>
</div>
<script>
    let sessions = JSON.parse(localStorage.getItem("vuslat_sessions") || "[]");
    let currentSessionId = localStorage.getItem("vuslat_curr_id") || null;
    let apiKey = localStorage.getItem("vuslat_ai_key") || "";
    let autoSpeak = localStorage.getItem("vuslat_autospeak") === "true";
    let attachedImageBase64 = null;
    let attachedMime = "image/jpeg";
    let recognition = null;
    let isListening = false;

    const personas = {
        general: "Senin adın Vuslat. Türkçe ve İngilizce dillerine ana dili gibi hakim, çok zeki, hızlı ve samimi bir süper asistansın. Kullanıcı hangi dilde yazarsa o dilde net yanıt ver. Asla iç düşünce notu yazma.",
        english: "Senin adın Vuslat ve harika bir İngilizce öğretmenisin. Kullanıcıyla hem İngilizce pratik yap hem de Türkçe açıklamalarla gramer/kelime hatalarını nazikçe düzelt.",
        coder: "Senin adın Vuslat ve kıdemli bir yazılım mühendisisin. Temiz, hatasız kodlar yaz ve kısa Türkçe açıklamalar ekle.",
        friend: "Senin adın Vuslat. Çok samimi, esprili, enerjik ve kafa dengi bir yakın arkadaş gibi konuş."
    };

    function getCurrentSession() {
        let s = sessions.find(x => x.id === currentSessionId);
        if (!s) {
            s = { id: "s_" + Date.now(), title: "Yeni Sohbet", messages: [] };
            sessions.unshift(s);
            currentSessionId = s.id;
            saveSessions();
        }
        return s;
    }

    function saveSessions() {
        localStorage.setItem("vuslat_sessions", JSON.stringify(sessions.slice(0, 20)));
        localStorage.setItem("vuslat_curr_id", currentSessionId);
    }

    function newChat() {
        const s = { id: "s_" + Date.now(), title: "Yeni Sohbet", messages: [] };
        sessions.unshift(s);
        currentSessionId = s.id;
        saveSessions();
        document.getElementById("historyModal").style.display = "none";
        renderChat();
    }

    function openHistory() {
        const list = document.getElementById("historyList");
        list.innerHTML = "";
        sessions.forEach(s => {
            const div = document.createElement("div");
            div.className = "hist-item";
            div.innerHTML = `<span>💬 ${s.title}</span><span style="color:#ef4444; font-weight:bold;" onclick="deleteSession('${s.id}', event)">🗑️</span>`;
            div.onclick = () => { currentSessionId = s.id; saveSessions(); document.getElementById("historyModal").style.display = "none"; renderChat(); };
            list.appendChild(div);
        });
        document.getElementById("historyModal").style.display = "flex";
    }

    function deleteSession(id, e) {
        e.stopPropagation();
        sessions = sessions.filter(x => x !== id);
        if (currentSessionId === id) currentSessionId = sessions.at(0)?.id || null;
        saveSessions();
        openHistory();
        renderChat();
    }

    function toggleAutoSpeak() {
        autoSpeak = !autoSpeak;
        localStorage.setItem("vuslat_autospeak", autoSpeak);
        updateAutoSpeakUI();
    }

    function updateAutoSpeakUI() {
        const btn = document.getElementById("autoSpeakBtn");
        btn.innerText = autoSpeak ? "🔊 Oto-Ses" : "🔇 Oto-Ses";
        btn.classList.toggle("active", autoSpeak);
    }

    function openSettings() {
        document.getElementById("apiKeyInput").value = apiKey;
        document.getElementById("settingsModal").style.display = "flex";
    }
    function closeSettings() { document.getElementById("settingsModal").style.display = "none"; }
    function saveSettings() {
        apiKey = document.getElementById("apiKeyInput").value.trim();
        localStorage.setItem("vuslat_ai_key", apiKey);
        localStorage.removeItem("vuslat_fast_model");
        closeSettings();
        addMessage("ai", "API anahtarın kaydedildi! Artık sohbet edebilir, fotoğraf yükleyip yorumlatabilir veya 🎨 Çiz butonuyla resim üretebilirsin.");
    }

    function quickAsk(txt) {
        const input = document.getElementById("userInput");
        input.value = txt;
        input.focus();
    }

    function handleImageUpload(event) {
        const file = event.target.files.item(0);
        if (!file) return;
        attachedMime = file.type || "image/jpeg";
        const reader = new FileReader();
        reader.onload = (e) => {
            const fullDataUrl = e.target.result;
            attachedImageBase64 = fullDataUrl.split(",").at(1);
            document.getElementById("previewImg").src = fullDataUrl;
            document.getElementById("previewBar").style.display = "flex";
        };
        reader.readAsDataURL(file);
        event.target.value = "";
    }

    function clearAttachedImage() {
        attachedImageBase64 = null;
        document.getElementById("previewBar").style.display = "none";
    }

    function speakText(text) {
        if (!("speechSynthesis" in window)) return;
        window.speechSynthesis.cancel();
        const utter = new SpeechSynthesisUtterance(text.replace(/[*#`]/g, ""));
        utter.lang = /[çğıöşüÇĞİÖŞÜ]/.test(text) ? "tr-TR" : "en-US";
        utter.rate = 1.05;
        window.speechSynthesis.speak(utter);
    }
    function addMessage(role, text, imgUrl = null) {
        const s = getCurrentSession();
        if (role === "user" && s.messages.length === 0) s.title = text.slice(0, 26);
        s.messages.push({ role, text, imgUrl });
        saveSessions();
        renderChat();
        if (role === "ai" && autoSpeak && text) speakText(text);
    }

    function renderChat() {
        const box = document.getElementById("chatBox");
        const s = getCurrentSession();
        box.innerHTML = "";
        if (s.messages.length === 0) {
            box.innerHTML = `<div class="msg ai">Merhaba! Ben <b>Vuslat</b>. Bana istediğin soruyu sorabilir, <b>📷</b> ile fotoğraf gönderip analiz ettirebilir veya <b>🎨 Çiz</b> butonuyla hayalindeki resmi ürettirebilirsin.</div>`;
            return;
        }
        s.messages.forEach(m => {
            const div = document.createElement("div");
            div.className = "msg " + m.role;
            if (m.text) {
                const p = document.createElement("div");
                p.innerText = m.text;
                div.appendChild(p);
            }
            if (m.imgUrl) {
                const img = document.createElement("img");
                img.src = m.imgUrl;
                div.appendChild(img);
            }
            if (m.role === "ai") {
                const acts = document.createElement("div");
                acts.className = "msg-actions";
                if (m.text) {
                    acts.innerHTML += `<span class="act-tag" onclick='speakText(${JSON.stringify(m.text)})'>🔊 Dinle</span>`;
                    acts.innerHTML += `<span class="act-tag" onclick='navigator.clipboard.writeText(${JSON.stringify(m.text)}); this.innerText="✓ Kopyalandı"'>📋 Kopyala</span>`;
                }
                if (m.imgUrl) {
                    acts.innerHTML += `<a class="act-tag" href="${m.imgUrl}" download="vuslat-ai-resim.jpg" target="_blank">⬇️ Resmi İndir</a>`;
                }
                div.appendChild(acts);
            }
            box.appendChild(div);
        });
        box.scrollTop = box.scrollHeight;
    }

    function generateImagePrompt(promptText) {
        document.getElementById("userInput").value = promptText;
        triggerImageGen();
    }

    async function triggerImageGen() {
        const input = document.getElementById("userInput");
        const promptText = input.value.trim();
        if (!promptText) { alert("Önce çizdirmek istediğin resmi kutuya yaz!"); return; }
        input.value = "";
        addMessage("user", "🎨 Çiz: " + promptText);

        const box = document.getElementById("chatBox");
        const loadingDiv = document.createElement("div");
        loadingDiv.className = "msg ai";
        loadingDiv.innerText = "🎨 Vuslat resmini çiziyor...";
        box.appendChild(loadingDiv);
        box.scrollTop = box.scrollHeight;

        try {
            let engPrompt = promptText;
            if (apiKey) {
                const trRes = await askGeminiFast("Translate this image prompt to detailed English for an AI image generator, output ONLY the English prompt: " + promptText, null, null, true);
                if (trRes && !trRes.includes("yoğun")) engPrompt = trRes;
            }
            const seed = Math.floor(Math.random() * 999999);
            const imgApi = atob("aHR0cHM6Ly9pbWFnZS5wb2xsaW5hdGlvbnMuYWkvcHJvbXB0Lw==");
            const finalImgUrl = `${imgApi}${encodeURIComponent(engPrompt)}?width=1024&height=1024&seed=${seed}&nologo=true`;
            loadingDiv.remove();
            addMessage("ai", `"${promptText}" için hazırladığım görsel:`, finalImgUrl);
        } catch (e) {
            loadingDiv.remove();
            addMessage("ai", "Görsel oluşturulurken bir hata oluştu.");
        }
    }

    async function askGeminiFast(text, imgBase64 = null, mimeType = null, rawTranslate = false) {
        const apiBase = atob("aHR0cHM6Ly9nZW5lcmF0aXZlbGFuZ3VhZ2UuZ29vZ2xlYXBpcy5jb20vdjFiZXRhLw==");
        let savedModel = localStorage.getItem("vuslat_fast_model");
        const mode = document.getElementById("personaSelect").value;
        const sysPrompt = rawTranslate ? "You are a translator." : personas[mode];

        const userParts = [];
        if (text) userParts.push({ text: text });
        if (imgBase64) userParts.push({ inlineData: { mimeType: mimeType, data: imgBase64 } });

        const s = getCurrentSession();
        const historyParts = rawTranslate ? [] : s.messages.slice(-6, -1).filter(m => m.text).map(m => ({
            role: m.role === "user" ? "user" : "model",
            parts: [{ text: m.text }]
        }));
        historyParts.push({ role: "user", parts: userParts });

        const extractReply = (data) => {
            const parts = data.candidates?.at(0)?.content?.parts || [];
            const realPart = parts.find(p => !p.thought && p.text) || parts.at(-1);
            return realPart?.text || (data.error?.message || "Yanıt alınamadı.");
        };

        const callModel = async (m) => {
            const url = `${apiBase}${m}:generateContent?key=${encodeURIComponent(apiKey)}`;
            return await fetch(url, {
                method: "POST",
                headers: { "Content-Type": "application/json" },
                body: JSON.stringify({
                    systemInstruction: { parts: [{ text: sysPrompt }] },
                    contents: historyParts
                })
            });
        };

        if (savedModel) {
            const res = await callModel(savedModel);
            const data = await res.json();
            if (res.ok && data.candidates) return extractReply(data);
        }

        const listRes = await fetch(`${apiBase}models?key=${encodeURIComponent(apiKey)}`);
        const listData = await listRes.json();
        const activeModels = (listData.models || []).filter(m =>
            m.supportedGenerationMethods?.includes("generateContent") &&
            !m.name.includes("1.5") && !m.name.includes("2.5") && !m.name.includes("2.0")
        );

        for (const m of activeModels) {
            const res = await callModel(m.name);
            const data = await res.json();
            if (res.ok && data.candidates) {
                localStorage.setItem("vuslat_fast_model", m.name);
                return extractReply(data);
            }
        }
        return "Sunucu şu an yoğun, lütfen tekrar dene.";
    }

    async function sendMessage() {
        const input = document.getElementById("userInput");
        const text = input.value.trim();
        if (!text && !attachedImageBase64) return;
        const imgData = attachedImageBase64;
        const imgMime = attachedMime;
        const previewSrc = imgData ? document.getElementById("previewImg").src : null;

        input.value = "";
        clearAttachedImage();
        addMessage("user", text || "Bu fotoğrafı analiz et.", previewSrc);

        if (!apiKey) {
            addMessage("ai", "Henüz API anahtarı girmedin. Sağ üstteki ⚙️ API butonuna basarak anahtarını ekleyebilirsin.");
            return;
        }

        const box = document.getElementById("chatBox");
        const loadingDiv = document.createElement("div");
        loadingDiv.className = "msg ai";
        loadingDiv.innerText = "⚡ Vuslat yazıyor...";
        box.appendChild(loadingDiv);
        box.scrollTop = box.scrollHeight;

        try {
            const reply = await askGeminiFast(text || "Bu görselde ne var? Türkçe detaylı açıkla.", imgData, imgMime, false);
            loadingDiv.remove();
            addMessage("ai", reply);
        } catch (e) {
            loadingDiv.remove();
            addMessage("ai", "Bağlantı hatası oluştu, internetini kontrol et.");
        }
    }

    function toggleVoice() {
        const SpeechRec = window.SpeechRecognition || window.webkitSpeechRecognition;
        if (!SpeechRec) { alert("Tarayıcınız sesli giriş desteklemiyor."); return; }
        if (isListening && recognition) { recognition.stop(); return; }
        recognition = new SpeechRec();
        recognition.lang = "tr-TR";
        recognition.onstart = () => { isListening = true; document.getElementById("micBtn").classList.add("listening"); };
        recognition.onend = () => { isListening = false; document.getElementById("micBtn").classList.remove("listening"); };
        recognition.onresult = (e) => {
            document.getElementById("userInput").value = e.results.item(0).item(0).transcript;
            sendMessage();
        };
        recognition.start();
    }

    updateAutoSpeakUI();
    renderChat();
</script>
</body>
</html>
