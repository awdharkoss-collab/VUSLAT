<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>VUSLAT • Kişisel Asistan</title>
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="VUSLAT">
    <link rel="apple-touch-icon" href="logo.png">
    <style>
        :root { --bg: #0b0c10; --panel: #14161f; --accent: #7c3aed; --text: #f3f4f6; }
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', Roboto, sans-serif; }
        body { background: var(--bg); color: var(--text); height: 100vh; display: flex; flex-direction: column; overflow: hidden; }
        header { background: var(--panel); padding: 14px 18px; display: flex; align-items: center; justify-content: space-between; border-bottom: 1px solid rgba(255,255,255,0.08); }
        .logo { font-size: 22px; font-weight: 900; background: linear-gradient(90deg, #a78bfa, #22d3ee); -webkit-background-clip: text; -webkit-text-fill-color: transparent; letter-spacing: 1.5px; }
        .header-btns { display: flex; gap: 8px; }
        .icon-btn { background: #1f2230; color: #fff; border: 1px solid rgba(255,255,255,0.12); padding: 7px 12px; border-radius: 8px; font-size: 12px; font-weight: 700; cursor: pointer; }
        .chips { display: flex; gap: 8px; overflow-x: auto; padding: 10px 14px; background: #0e1017; border-bottom: 1px solid rgba(255,255,255,0.05); scrollbar-width: none; }
        .chips::-webkit-scrollbar { display: none; }
        .chip { background: #1a1d2b; color: #d1d5db; border: 1px solid rgba(124,58,237,0.35); padding: 6px 12px; border-radius: 16px; font-size: 12px; white-space: nowrap; cursor: pointer; }
        .chat-box { flex: 1; overflow-y: auto; padding: 16px; display: flex; flex-direction: column; gap: 14px; }
        .msg { max-width: 85%; padding: 12px 15px; border-radius: 14px; font-size: 14px; line-height: 1.55; word-wrap: break-word; white-space: pre-wrap; }
        .msg.user { align-self: flex-end; background: linear-gradient(135deg, #7c3aed, #5b21b6); color: #fff; border-bottom-right-radius: 4px; }
        .msg.ai { align-self: flex-start; background: var(--panel); border: 1px solid rgba(255,255,255,0.08); color: #e5e7eb; border-bottom-left-radius: 4px; }
        .speak-tag { display: inline-block; margin-top: 8px; font-size: 11px; color: #38bdf8; cursor: pointer; font-weight: 700; }
        .input-bar { background: var(--panel); padding: 10px 14px; display: flex; gap: 8px; align-items: center; border-top: 1px solid rgba(255,255,255,0.08); }
        .text-in { flex: 1; background: #1d202e; border: 1px solid rgba(255,255,255,0.15); color: #fff; padding: 11px 14px; border-radius: 22px; font-size: 14px; outline: none; }
        .mic-btn { background: #1f2230; color: #fff; border: 1px solid rgba(255,255,255,0.15); width: 42px; height: 42px; border-radius: 50%; font-size: 18px; cursor: pointer; }
        .mic-btn.listening { background: #ef4444; border-color: #ef4444; }
        .send-btn { background: var(--accent); color: #fff; border: none; padding: 0 18px; height: 42px; border-radius: 22px; font-weight: 700; font-size: 14px; cursor: pointer; }
        .modal { display: none; position: fixed; inset: 0; background: rgba(0,0,0,0.88); z-index: 999; align-items: center; justify-content: center; padding: 20px; }
        .modal-card { background: var(--panel); border: 1px solid var(--accent); border-radius: 14px; padding: 20px; width: 100%; max-width: 440px; }
        .modal-card h3 { margin-bottom: 10px; font-size: 18px; }
        .modal-card input, .modal-card select { width: 100%; background: #0d0f16; color: #fff; border: 1px solid #333; padding: 10px; border-radius: 8px; margin-bottom: 12px; font-size: 13px; outline: none; }
    </style>
</head>
<body>
<header>
    <div class="logo">VUSLAT</div>
    <div class="header-btns">
        <button type="button" class="icon-btn" onclick="clearChat()">🗑️ Temizle</button>
        <button type="button" class="icon-btn" onclick="openSettings()">⚙️ API Ayarı</button>
    </div>
</header>

<div class="chips">
    <div class="chip" onclick="quickAsk('Bana bugün için verimli bir çalışma planı hazırla.')">📅 Günlük Plan</div>
    <div class="chip" onclick="quickAsk('Şu metni profesyonel İngilizceye çevir: ')">🌐 Çeviri Yap</div>
    <div class="chip" onclick="quickAsk('Bana kısa ve etkileyici bir hikaye yaz.')">✍️ Hikaye Yaz</div>
    <div class="chip" onclick="quickAsk('Python ile basit bir hesap makinesi kodu yaz.')">💻 Kod Yaz</div>
    <div class="chip" onclick="quickAsk('Bana 5 maddede genel kültür bilgisi ver.')">🧠 Bilgi Ver</div>
</div>

<div class="chat-box" id="chatBox"></div>

<div class="input-bar">
    <button type="button" id="micBtn" class="mic-btn" onclick="toggleVoice()">🎤</button>
    <input type="text" id="userInput" class="text-in" placeholder="Vuslat'a bir şey sor..." onkeyup="if(event.key==='Enter') sendMessage()">
    <button type="button" class="send-btn" onclick="sendMessage()">Gönder</button>
</div>

<div class="modal" id="settingsModal">
    <div class="modal-card">
        <h3>⚙️ Vuslat API Ayarı</h3>
        <p style="font-size:12px; color:#9ca3af; margin-bottom:12px;">Google AI Studio'dan aldığınız ücretsiz Gemini API anahtarını girin (yalnızca cihazınızda saklanır).</p>
        <select id="providerSelect">
            <option value="gemini">Google Gemini (Ücretsiz API)</option>
            <option value="openai">OpenAI (GPT-4o-mini)</option>
        </select>
        <input type="password" id="apiKeyInput" placeholder="API Anahtarınızı yapıştırın (AIza... veya sk-...)">
        <div style="display:flex; gap:10px; justify-content:flex-end;">
            <button type="button" class="icon-btn" onclick="closeSettings()">Kapat</button>
            <button type="button" class="send-btn" style="height:36px;" onclick="saveSettings()">Kaydet</button>
        </div>
    </div>
</div>
<script>
    let chatHistory = JSON.parse(localStorage.getItem("vuslat_ai_chat") || "[]");
    let apiKey = localStorage.getItem("vuslat_ai_key") || "";
    let provider = localStorage.getItem("vuslat_ai_prov") || "gemini";
    let recognition = null;
    let isListening = false;

    function openSettings() {
        document.getElementById("apiKeyInput").value = apiKey;
        document.getElementById("providerSelect").value = provider;
        document.getElementById("settingsModal").style.display = "flex";
    }
    function closeSettings() { document.getElementById("settingsModal").style.display = "none"; }
    function saveSettings() {
        apiKey = document.getElementById("apiKeyInput").value.trim();
        provider = document.getElementById("providerSelect").value;
        localStorage.setItem("vuslat_ai_key", apiKey);
        localStorage.setItem("vuslat_ai_prov", provider);
        closeSettings();
        addMessage("ai", "API anahtarın kaydedildi! Ben Vuslat, bana istediğin soruyu sorabilirsin.");
    }

    function clearChat() {
        chatHistory = [];
        localStorage.removeItem("vuslat_ai_chat");
        renderChat();
    }

    function quickAsk(promptText) {
        const input = document.getElementById("userInput");
        input.value = promptText;
        input.focus();
    }

    function speakText(text) {
        if (!("speechSynthesis" in window)) return;
        window.speechSynthesis.cancel();
        const utter = new SpeechSynthesisUtterance(text);
        utter.lang = "tr-TR";
        window.speechSynthesis.speak(utter);
    }

    function addMessage(role, text) {
        chatHistory.push({ role, text });
        localStorage.setItem("vuslat_ai_chat", JSON.stringify(chatHistory.slice(-40)));
        renderChat();
    }

    function renderChat() {
        const box = document.getElementById("chatBox");
        box.innerHTML = "";
        if (chatHistory.length === 0) {
            box.innerHTML = `<div class="msg ai">Merhaba! Ben <b>Vuslat</b>. Sağ üstteki <b>⚙️ API Ayarı</b> butonundan ücretsiz Gemini API anahtarını girerek benimle sesli veya yazılı sohbet edebilirsin.</div>`;
            return;
        }
        chatHistory.forEach(m => {
            const div = document.createElement("div");
            div.className = "msg " + m.role;
            div.innerText = m.text;
            if (m.role === "ai") {
                const sp = document.createElement("div");
                sp.className = "speak-tag";
                sp.innerText = "🔊 Sesli Dinle";
                sp.onclick = () => speakText(m.text);
                div.appendChild(sp);
            }
            box.appendChild(div);
        });
        box.scrollTop = box.scrollHeight;
    }

    async function sendMessage() {
        const input = document.getElementById("userInput");
        const text = input.value.trim();
        if (!text) return;
        input.value = "";
        addMessage("user", text);

        if (!apiKey) {
            addMessage("ai", "Henüz API anahtarı girmedin. Sağ üstteki ⚙️ API Ayarı butonuna basarak anahtarını ekleyebilirsin.");
            return;
        }

        const box = document.getElementById("chatBox");
        const loadingDiv = document.createElement("div");
        loadingDiv.className = "msg ai";
        loadingDiv.innerText = "Vuslat düşünüyor...";
        box.appendChild(loadingDiv);
        box.scrollTop = box.scrollHeight;

        try {
            let reply = "";
            if (provider === "gemini") {
                const url = atob("aHR0cHM6Ly9nZW5lcmF0aXZlbGFuZ3VhZ2UuZ29vZ2xlYXBpcy5jb20vdjFiZXRhL21vZGVscy9nZW1pbmktMS41LWZsYXNoOmdlbmVyYXRlQ29udGVudD9rZXk9") + encodeURIComponent(apiKey);
                const res = await fetch(url, {
                    method: "POST",
                    headers: { "Content-Type": "application/json" },
                    body: JSON.stringify({
                        systemInstruction: { parts: [{ text: "Senin adın Vuslat. Samimi, zeki, yardımsever ve Türkçe konuşan kişisel bir yapay zeka asistanısın." }] },
                        contents: [{ parts: [{ text: text }] }]
                    })
                });
                const data = await res.json();
                reply = data.candidates?.at(0)?.content?.parts?.at(0)?.text || (data.error?.message || "Yanıt alınamadı.");
            } else {
                const url = atob("aHR0cHM6Ly9hcGkub3BlbmFpLmNvbS92MS9jaGF0L2NvbXBsZXRpb25z");
                const res = await fetch(url, {
                    method: "POST",
                    headers: { "Content-Type": "application/json", "Authorization": "Bearer " + apiKey },
                    body: JSON.stringify({
                        model: "gpt-4o-mini",
                        messages: [
                            { role: "system", content: "Senin adın Vuslat. Samimi, zeki, yardımsever ve Türkçe konuşan kişisel bir yapay zeka asistanısın." },
                            { role: "user", content: text }
                        ]
                    })
                });
                const data = await res.json();
                reply = data.choices?.at(0)?.message?.content || (data.error?.message || "Yanıt alınamadı.");
            }
            loadingDiv.remove();
            addMessage("ai", reply);
        } catch (e) {
            loadingDiv.remove();
            addMessage("ai", "Bağlantı hatası oluştu, internetini veya API anahtarını kontrol et.");
        }
    }

    function toggleVoice() {
        const SpeechRec = window.SpeechRecognition || window.webkitSpeechRecognition;
        if (!SpeechRec) { alert("Tarayıcınız sesli giriş desteklemiyor."); return; }
        if (isListening && recognition) { recognition.stop(); return; }
        recognition = new SpeechRec();
        recognition.lang = "tr-TR";
        recognition.onstart = () => { isListening = true; document.getElementById("micBtn").classList.add("listening"); };
        recognition.onend = () => { isListening = false; document.getElementById("micBtn").classList.remove("listening"); };
        recognition.onresult = (e) => {
            document.getElementById("userInput").value = e.results.item(0).item(0).transcript;
            sendMessage();
        };
        recognition.start();
    }

    renderChat();
</script>
</body>
</html>
